# Experimental only: Firestore preserves WhatsApp auth state, but this free
# Render service does not persist the rest of Evolution API's local store.
# Do not use for production clients until webhook/settings storage is externalized.
services:
  - type: web
    name: evolution-api-free-test
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    autoDeploy: false
    healthCheckPath: /health
    envVars:
      - key: SERVER_PORT
        value: "10000"
      - key: SERVER_URL
        sync: false
      - key: AUTHENTICATION_API_KEY
        sync: false
      - key: AUTHENTICATION_EXPOSE_IN_FETCH_INSTANCES
        value: "false"
      - key: AUTH_STATE_STORAGE
        value: firebase
      - key: FIREBASE_PROJECT_ID
        sync: false
      - key: FIREBASE_SERVICE_ACCOUNT_JSON
        sync: false
      - key: CORS_ORIGIN
        value: "*"
      - key: CORS_METHODS
        value: "POST,GET,PUT,DELETE"
      - key: CORS_CREDENTIALS
        value: "false"
      - key: DATABASE_ENABLED
        value: "false"
      - key: PROVIDER_ENABLED
        value: "false"
      - key: SQS_ENABLED
        value: "false"
      - key: CACHE_REDIS_ENABLED
        value: "false"
      - key: WEBHOOK_GLOBAL_ENABLED
        value: "false"
